name: Refresh release-note approval

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main]
  issue_comment:
    types: [edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to refresh
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: release-notes-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # Only trusted main code is executed, including for fork PRs.
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Refresh required commit status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: python3 scripts/release_notes_pr.py gate --pr "$PR_NUMBER"
