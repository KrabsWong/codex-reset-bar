name: Release macOS app

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write

# Serialize publication so an older build cannot race a newer latest release.
concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare toolchain and validate architecture
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Validate main ancestry and synchronize version from tag
        run: python3 scripts/prepare_release.py --tag "$RELEASE_TAG"
      - name: Test
        run: |
          cargo test --locked
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Package ad-hoc signed app
        run: bash scripts/package.sh
      - name: Verify production updater preferences
        run: python3 scripts/test-updater.py --sdk build/sparkle/sdk
      - name: Sign update archive and appcast
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: python3 scripts/release.py --tag "$RELEASE_TAG"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py --tag "$RELEASE_TAG" --publish
