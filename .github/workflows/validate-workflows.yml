name: Validate workflows

on:
  pull_request:
    paths: ['.github/workflows/**', '.github/actionlint.yaml']
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/actionlint.yaml']

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - name: Install pinned workflow validator
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflow syntax and expression contexts
        run: actionlint -color -shellcheck= -pyflakes=
