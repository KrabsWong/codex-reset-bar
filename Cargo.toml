[package]
name = "codex-reset"
version = "0.1.3"
edition = "2024"
description = "A macOS menu bar app for Codex reset announcements, built with Native Shell"
publish = false

[workspace]

[lib]
name = "codex_reset"
path = "src/lib.rs"

[[bin]]
name = "codex-reset"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
nsh-core = "0.2.0"
nsh-base = "0.2.0"
async-channel = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.2.0", default-features = false }
# AppKit from the engine thread: quit and close hop to the main queue.
dispatch2 = "0.3.1"
block2 = "0.6.2"
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer"] }
# The classes the host adds on top of what NSH's backend enables: the status
# item, its popover and the controller that answers the click.
objc2 = { version = "0.6.5", features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSBox",
  "NSFont",
  "NSTextField",
  "NSImageView",
  "NSPopUpButton",
  "NSAlert",
  "NSBezierPath",
  "NSColor",
  "NSOpenPanel",
  "NSSavePanel",
  "NSPanel",
  "NSAppearance",
  "NSApplication",
  "NSBitmapImageRep",
  "NSButton",
  "NSCell",
  "NSControl",
  "NSEvent",
  "NSImage",
  "NSImageRep",
  "NSMenu",
  "NSMenuItem",
  "NSPopover",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
  "NSViewController",
  "NSWindow",
  "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSBundle",
  "NSCoder",
  "NSData",
  "NSError",
  "NSURLSession",
  "NSURLRequest",
  "NSURLResponse",
  "block2",
  "NSDate",
  "NSDictionary",
  "NSRunLoop",
  "NSGeometry",
  "NSNotification",
  "NSObject",
  "NSString",
  "NSURL",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
